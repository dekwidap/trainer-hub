<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Trainer - Trainer Hub</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        (function () {
            const savedTheme = localStorage.getItem("trainerHubTheme");

            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark-mode");
            }
        })();
    </script>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <!-- Logo dan Judul -->
        <div class="header-brand">

            <div class="logo">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                    <path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z" />
                    <path d="m3.5 12 8.5 4.5 8.5-4.5" />
                    <path d="m3.5 16.5 8.5 4.5 8.5-4.5" />

                </svg>
            </div>

            <div class="header-title">
                <h1>Trainer Hub</h1>
                <p>Work Links Dashboard</p>
            </div>

        </div>


        <!-- NAVIGASI -->
        <nav class="header-nav" id="headerNav" aria-label="Navigasi utama">

            <a href="index.html" class="nav-link">
                <i data-lucide="house" aria-hidden="true"></i>
                <span>Home</span>
            </a>

            <a href="linkshortcut.html" class="nav-link">
                <i data-lucide="link" aria-hidden="true"></i>
                <span>Link Shortcut</span>
            </a>

            <a href="calendar.html" class="nav-link">
                <i data-lucide="calendar-days" aria-hidden="true"></i>
                <span>Jadwal Trainer</span>
            </a>


            <!-- Dropdown Daily PMS Report -->
            <div class="nav-dropdown" id="dailyReportDropdown">

                <button class="nav-link nav-dropdown-toggle" id="dailyReportToggle" type="button" aria-expanded="false"
                    aria-controls="dailyReportSubmenu">

                    <i data-lucide="chart-no-axes-column" aria-hidden="true"></i>

                    <span>Daily PMS Report</span>

                    <i data-lucide="chevron-down" class="dropdown-chevron" aria-hidden="true">
                    </i>

                </button>


                <div class="nav-submenu" id="dailyReportSubmenu">

                    <a href="dailypmsreport.html" class="nav-sublink">
                        <i data-lucide="file-pen-line" aria-hidden="true"></i>
                        <span>Input Laporan</span>
                    </a>

                    <a href="readdailypmsreport.html" class="nav-sublink">
                        <i data-lucide="file-text" aria-hidden="true"></i>
                        <span>Lihat Laporan</span>
                    </a>

                </div>

            </div>

        </nav>


        <!-- AKSI HEADER -->
        <div class="header-actions">

            <!-- Dark / Light Mode -->
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Aktifkan dark mode"
                title="Ganti tema">

                <svg id="themeIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                    <circle cx="12" cy="12" r="4" />

                    <path d="M12 2v2" />
                    <path d="M12 20v2" />
                    <path d="m4.93 4.93 1.42 1.42" />
                    <path d="m17.65 17.65 1.42 1.42" />
                    <path d="M2 12h2" />
                    <path d="M20 12h2" />
                    <path d="m4.93 19.07 1.42-1.42" />
                    <path d="m17.65 6.35 1.42-1.42" />

                </svg>

            </button>


            <!-- Hamburger Mobile -->
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Buka navigasi"
                aria-controls="headerNav" aria-expanded="false" title="Buka menu">

                <i data-lucide="menu" aria-hidden="true"></i>

            </button>

        </div>

    </header>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <section class="calendar-page">

            <div class="calendar-page-header">

                <h2>Jadwal Trainer</h2>

                <p>
                    Kalender jadwal kerja trainer dan penyesuaian jadwal.
                </p>

            </div>

            <!-- Kalender akan kita bangun di sini -->
            <div class="calendar-container">

                <p class="calendar-placeholder">
                    Calendar akan dibuat pada tahap berikutnya.
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <p class="footer-title">
            Trainer Hub
        </p>

        <p class="footer-description">
            Work Links Dashboard
        </p>

        <p class="footer-copyright">
            © 2026 Trainer Hub
        </p>

    </footer>


    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SCRIPT UTAMA -->
    <script src="js/script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
